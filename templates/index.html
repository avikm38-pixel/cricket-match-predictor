<!DOCTYPE html>
<html>
<head>
    <title>Cricket Score Predictor</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; }
        button { margin-top: 20px; padding: 10px 20px; background: #333; color: white; border: none; cursor: pointer; }
        #result { margin-top: 20px; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Predict T20 Match Score</h1>
    <form id="predictForm">
        <label>Venue</label>
        <input type="text" name="venue" required>

        <label>Batting Team</label>
        <input type="text" name="bat_team" required>

        <label>Bowling Team</label>
        <input type="text" name="bowl_team" required>

        <label>Overs Completed</label>
        <input type="number" step="0.1" name="overs" required>

        <label>Runs So Far</label>
        <input type="number" name="runs" required>

        <label>Wickets Lost</label>
        <input type="number" name="wickets" required>

        <button type="submit">Predict Score</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('predictForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = {};
            formData.forEach((value, key) => {
                data[key] = isNaN(value) ? value : Number(value);
            });

            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            document.getElementById('result').innerText = 
                'Predicted Final Score: ' + result.predicted_score;
        });
    </script>
</body>
</html>
